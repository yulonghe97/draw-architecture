name: publish

# Tag a release to publish it:
#   npm version patch && git push --follow-tags
#
# Publishes over OIDC as a trusted publisher, so there is no token to leak or
# rotate. npm matches the run against org/repo/workflow filename, which means
# renaming this file breaks publishing until the trusted publisher is updated.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # mints the OIDC token npm authenticates with

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24 already bundles a new
      # enough npm, but the bundled version moves with the runner image, so
      # pin the floor here rather than inherit whatever ships that week.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be undone. Fail loudly instead.
      # TAG comes in as an env var, never interpolated into the script.
      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$TAG" ]; then
            echo "tag $TAG does not match package.json ($pkg)" >&2
            exit 1
          fi

      # The package has no dependencies and nothing to build, so the only
      # pre-flight check worth running is that the skill it ships is valid.
      - name: Validate the example scene
        run: node scripts/validate.js examples/shoply-scene.js

      # No NODE_AUTH_TOKEN: the OIDC token stands in for it. Provenance is
      # implied by a trusted-publisher run, but --provenance is kept so a
      # publish that somehow falls back to token auth still gets attested.
      - name: Publish
        run: npm publish --provenance --access public
